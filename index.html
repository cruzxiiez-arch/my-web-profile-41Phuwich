<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ของฉัน</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f9;
      color: #333333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background-color: #2c3e50;
      color: #ffffff;
      width: 100%;
      text-align: center;
      padding: 20px 0;
      margin-bottom: 30px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .card {
      background-color: #ffffff;
      width: 320px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #2c3e50;
      margin-bottom: 15px;
    }

    #profile-name {
      margin: 10px 0 5px;
      color: #2c3e50;
    }

    .bio {
      font-size: 14px;
      color: #666666;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    h3 {
      font-size: 16px;
      border-top: 1px solid #eeeeee;
      padding-top: 15px;
      margin-bottom: 10px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    ul li {
      background-color: #e8eef5;
      color: #2c3e50;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>โปรไฟล์ของฉัน (My Profile)</h1>
  </header>

  <main>
    <section class="card">
      <img src="fat.jpg" alt="รูปโปรไฟล์ตัวอย่าง">
      <h2 id="profile-name">ภูวิช อรุณชาติ</h2>
      <p class="bio">นักพัฒนาเว็บไซต์ที่ชื่นชอบการเรียนรู้สิ่งใหม่ๆ และรักการดื่มกาแฟ</p>

      <h3>ทักษะของฉัน</h3>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
    </section>
  </main>

</body>
</html>
