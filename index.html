<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของข้าวกล้อง</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #e3f1f8;
            color: #5c4033;
            font-family: "Sarabun", "Leelawadee UI", sans-serif;
        }

        .card {
            width: 100%;
            max-width: 380px;
            padding: 36px 28px;
            background: #fffdf9;
            border-top: 10px solid #8b6249;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(92, 64, 51, 0.12);
            text-align: center;
        }

        .photo {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            border: 5px solid #a8d5e8;
            border-radius: 50%;
            overflow: hidden;
            background: #f1e7dc;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .photo img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { margin-bottom: 8px; }

        p { margin-bottom: 24px; color: #8b6249; }

        ul { list-style: none; text-align: left; }

        li {
            margin-top: 10px;
            padding: 12px 16px;
            background: #eef7fb;
            border-left: 5px solid #8b6249;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <main class="card">
        <!-- ใส่รูปชื่อ photo.jpg ไว้โฟลเดอร์เดียวกับไฟล์นี้ -->
        <div class="photo">
            <span>ใส่รูปที่นี่</span>
            <img src="me.jpg" alt="" onerror="this.style.display='none'">
        </div>

        <h1>สวัสดีครับ</h1>
        <p>นี่คือเว็บโปรไฟล์ของฉันบน GitHub</p>

        <ul>
            <li><strong>ชื่อเล่น:</strong> ข้าวกล้อง</li>
            <li><strong>สิ่งที่กำลังเรียน:</strong> GitHub Desktop</li>
        </ul>
    </main>
</body>
</html>
